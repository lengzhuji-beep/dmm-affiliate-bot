name: DMM Affiliate Auto Post Bot

on:
  schedule:
    # 30分おきに実行
    - cron: '*/30 * * * *'
  workflow_dispatch: # 手動実行

permissions:
  contents: write

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      # 1. ソースコードのチェックアウト
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Node.js環境のセットアップ
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      # 3. 依存パッケージのインストール
      - name: Install dependencies
        run: npm install

      # 3. PlaywrightのChromiumブラウザのインストール
      - name: Install Playwright Browsers
        run: npx playwright install chromium --with-deps

      # 3.5 OpenVPNのインストール
      - name: Install OpenVPN
        run: |
          sudo apt-get update
          sudo apt-get install -y openvpn

      # 4. セッションCookieの復元
      - name: Restore Twitter Cookies
        run: |
          if [ -n "$TWITTER_COOKIES" ]; then
            echo "$TWITTER_COOKIES" > twitter_cookies.json
            echo "Successfully restored twitter_cookies.json"
          else
            echo "WARNING: TWITTER_COOKIES secret is empty!"
          fi
        env:
          TWITTER_COOKIES: ${{ secrets.TWITTER_COOKIES }}

      # 5. 日本のVPNへの接続とボットの実行 (エラー時は別サーバーで自動リトライ)
      - name: Connect to Japan VPN & Run Bot
        run: |
          chmod +x vpn_connect.sh
          ./vpn_connect.sh
        env:
          DMM_API_ID: ${{ secrets.DMM_API_ID }}
          DMM_AFFILIATE_ID: ${{ secrets.DMM_AFFILIATE_ID }}
          TWITTER_USERNAME: ${{ secrets.TWITTER_USERNAME }}
          TWITTER_PASSWORD: ${{ secrets.TWITTER_PASSWORD }}
          TWITTER_EMAIL: ${{ secrets.TWITTER_EMAIL }}
          TWITTER_SESSION_PATH: ./twitter_session
          HEADLESS: 'true'

      # 6. posted_ids.json と post_schedule.json の更新をGitにコミット
      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add posted_ids.json post_schedule.json 2>/dev/null || true
          if git diff --quiet && git diff --cached --quiet; then
            echo "No changes to commit. Skipping commit."
          else
            git commit -m "chore: update posted_ids.json and post_schedule.json [skip ci]"
            git push origin HEAD
            echo "Successfully updated changes in repository."
          fi

      # 7. VPNの切断
      - name: Disconnect VPN
        if: always()
        run: |
          sudo killall openvpn 2>/dev/null || true
